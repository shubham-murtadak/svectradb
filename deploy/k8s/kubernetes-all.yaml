apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: svectradb-pvc
  labels:
    app.kubernetes.io/name: svectradb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svectradb
  labels:
    app.kubernetes.io/name: svectradb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: svectradb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svectradb
    spec:
      containers:
        - name: svectradb
          image: ghcr.io/shubham-murtadak/svectradb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SVECTRA_DATA_DIR
              value: /data
          volumeMounts:
            - name: svectra-storage
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: svectra-storage
          persistentVolumeClaim:
            claimName: svectradb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: svectradb-service
  labels:
    app.kubernetes.io/name: svectradb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: svectradb
  ports:
    - name: http
      port: 8080
      targetPort: 8080
